[project]
name = "mar_dss"
version = "0.1.0"
description = "Managed Aquifer Recharge Decision Support System"
readme = "README.md"
authors = [
  {name = "Ayman H. Alzraiee", email = "aalzraiee@gsi-net.com"}
]
maintainers = [
  {name = "Ayman H. Alzraiee", email = "aalzraiee@gsi-net.com"}
]
classifiers = [
    # TODO
]
license = {text = "MIT"}
dependencies = [
  # CLI / app shell
  "typer>=0.12",
  "rich>=13.0",
  "waitress>=3.0",
  # Dashboard
  "dash>=2.14.0",
  "dash-bootstrap-components>=1.5.0",
  "dash-table>=5.0.0",
  "dash-leaflet>=1.0.0",
  "plotly>=5.17.0",
  "kaleido>=0.2",
  # Data / numerics
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scipy>=1.10.0",
  "networkx>=3.0",
  "matplotlib>=3.7.0",
  "PyYAML>=6.0",
  "requests>=2.28.0",
  # Geospatial / runoff
  "affine>=2.4.0",
  "fiona>=1.9.0",
  "geojson>=3.0.0",
  "geopandas>=0.14.0",
  "osmnx>=1.9.0",
  "pyproj>=3.5.0",
  "pysheds>=0.4",
  "rasterio>=1.3.0",
  "shapely>=2.0.0",
  # Reports
  "reportlab>=4.0",
  "pillow>=10.0.0",
]
requires-python = ">= 3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mar_dss = [
  "knowledge/*",
  "app/assets/*",
]

[project.optional-dependencies]
exe = [
  "pyinstaller>=6.0",
]
ai = [
  "google-genai>=1.0",
  "google-generativeai>=0.8",
  "python-dotenv>=1.0",
]
colleague = [
  # Extra pins used in the colleague share env (not required by core imports)
  "dash-ag-grid>=31.0",
  "openpyxl>=3.1",
  "xlsxwriter>=3.1",
  "folium>=0.15",
  "geopy>=2.4",
  "meteostat>=1.6",
  "scikit-learn>=1.3",
  "lxml>=5.0",
]
test = [
  "coverage",
  "pytest",
  "ruff",
  "ty",
  "ipdb",
]

[project.urls]
bugs = "https://github.com/aymanalz/mar_dss/issues"
changelog = "https://github.com/aymanalz/mar_dss/blob/master/changelog.md"
homepage = "https://github.com/aymanalz/mar_dss"

[project.scripts]
mar_dss = "mar_dss.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
