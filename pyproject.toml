[project]
name = "mar_dss"
version = "0.1.0"
description = "Managed Aquifer Recharge Decision Support System"
readme = "README.md"
authors = [
  {name = "Ayman H. Alzraiee", email = "aalzraiee@gsi-net.com"}
]
maintainers = [
  {name = "Ayman H. Alzraiee", email = "aalzraiee@gsi-net.com"}
]
classifiers = [
    # TODO
]
license = {text = "MIT"}
dependencies = [
  # CLI / app shell
  "typer>=0.12",
  "rich>=13.0",
  "waitress>=3.0",
  # Dashboard
  "dash>=2.14.0",
  "dash-bootstrap-components>=1.5.0",
  "dash-table>=5.0.0",
  "dash-leaflet>=1.0.0",
  "plotly>=5.17.0",
  "kaleido>=0.2",
  # Data / numerics
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scipy>=1.10.0",
  "networkx>=3.0",
  "matplotlib>=3.7.0",
  "PyYAML>=6.0",
  "requests>=2.28.0",
  # Geospatial / runoff
  "affine>=2.4.0",
  "fiona>=1.9.0",
  "geojson>=3.0.0",
  "geopandas>=0.14.0",
  "osmnx>=1.9.0",
  "pyproj>=3.5.0",
  "pysheds>=0.4",
  "rasterio>=1.3.0",
  "shapely>=2.0.0",
  # Reports
  "reportlab>=4.0",
  "pillow>=10.0.0",
]
requires-python = ">= 3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mar_dss = [
  "knowledge/*",
  "app/assets/*",
]

[project.optional-dependencies]
ai = [
  "google-genai>=1.0",
  "google-generativeai>=0.8",
  "python-dotenv>=1.0",
]
colleague = [
  # Extra pins used in the colleague share env (not required by core imports)
  "dash-ag-grid>=31.0",
  "openpyxl>=3.1",
  "xlsxwriter>=3.1",
  "folium>=0.15",
  "geopy>=2.4",
  "meteostat>=1.6",
  "scikit-learn>=1.3",
  "lxml>=5.0",
]
test = [
  "bump-my-version",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
  "tox-uv>=1.35.2",
  "ty",
  "ipdb",
]

[project.urls]
bugs = "https://github.com/GSIEnvironmental/mar_tool/issues"
changelog = "https://github.com/GSIEnvironmental/mar_tool/blob/main/CHANGELOG.md"
homepage = "https://github.com/GSIEnvironmental/mar_tool"

[project.scripts]
mar_dss = "mar_dss.cli:app"

[tool.tox]
requires = ["tox-uv>=1.35.2"]
env_list = ["py310", "py311", "py312", "py313"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
extras = ["test"]
parallel_show_output = true
set_env = { COVERAGE_FILE = "{env_tmp_dir}/.coverage" }
commands = [[
  "pytest",
  "--cov=mar_dss",
  "--cov-branch",
  "--cov-report=term-missing",
  "--color=yes",
  "-ra",
  { replace = "posargs", extend = true },
]]

[tool.coverage.run]
omit = ["*/mar_dss/pfdf/*"]

[tool.coverage.report]
include_namespace_packages = true

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120
# pfdf is copied from the USGS pfdf package, so leave it as is.
extend-exclude = ["src/mar_dss/pfdf"]

[tool.ruff.lint]
# Same rule set as our other apps.
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle[error]
    "F",   # pyflakes
    "I",   # isort
    "PLE", # pylint errors
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle[warning]
]
ignore = [
    "F402",   # Import {name} from {row} shadowed by loop variable
    "F841",   # unused variable
    "E741",   # ambiguous variable names
    "B007",   # loop control variables not in loop body
    "SIM108", # Use ternary operator {contents} instead of if-else-block
    "SIM210", # Remove unnecessary True if ... else False
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks

[tool.uv]
package = true

# Version bumps: `just bump-patch`, `just bump-minor` or `just bump-major`.
# Each one updates the version below and in [project], re-locks uv.lock,
# then commits and tags the result as v<version>. Pushing the tag to GitHub
# deploys to production (see .github/workflows/ci-cd.yaml).
[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version to {new_version}"
tag_message = "Version {new_version}"
pre_commit_hooks = [
    "uv lock",
    "git add uv.lock",
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# Turn the "Unreleased" section into a dated one for the new version.
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

______________________________________________________________________

## [{new_version}] - {now:%Y-%m-%d}"""
