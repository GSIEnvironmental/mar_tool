[project]
name = "mar_dss"
version = "0.1.0"
description = "Managed Aquifer Recharge Decision Support System"
readme = "README.md"
authors = [
  {name = "Ayman H. Alzraiee", email = "aalzraiee@gsi-net.com"}
]
maintainers = [
  {name = "Ayman H. Alzraiee", email = "aalzraiee@gsi-net.com"}
]
classifiers = [
    # TODO
]
license = {text = "MIT"}
dependencies = [
  # CLI / app shell
  "typer>=0.12",
  "rich>=13.0",
  "waitress>=3.0",
  # Dashboard
  "dash>=2.14.0",
  "dash-bootstrap-components>=1.5.0",
  "dash-table>=5.0.0",
  "dash-leaflet>=1.0.0",
  "plotly>=5.17.0",
  "kaleido>=0.2",
  # Data / numerics
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scipy>=1.10.0",
  "networkx>=3.0",
  "matplotlib>=3.7.0",
  "PyYAML>=6.0",
  "requests>=2.28.0",
  # Geospatial / runoff
  "affine>=2.4.0",
  "fiona>=1.9.0",
  "geojson>=3.0.0",
  "geopandas>=0.14.0",
  "osmnx>=1.9.0",
  "pyproj>=3.5.0",
  "pysheds>=0.4",
  "rasterio>=1.3.0",
  "shapely>=2.0.0",
  # Reports
  "reportlab>=4.0",
  "pillow>=10.0.0",
]
requires-python = ">= 3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mar_dss = [
  "knowledge/*",
  "app/assets/*",
]

[project.optional-dependencies]
ai = [
  "google-genai>=1.0",
  "google-generativeai>=0.8",
  "python-dotenv>=1.0",
]
colleague = [
  # Extra pins used in the colleague share env (not required by core imports)
  "dash-ag-grid>=31.0",
  "openpyxl>=3.1",
  "xlsxwriter>=3.1",
  "folium>=0.15",
  "geopy>=2.4",
  "meteostat>=1.6",
  "scikit-learn>=1.3",
  "lxml>=5.0",
]
test = [
  "bump-my-version",
  "coverage",
  "pre-commit",
  "pytest",
  "ruff",
  "ty",
  "ipdb",
]

[project.urls]
bugs = "https://github.com/GSIEnvironmental/mar_tool/issues"
changelog = "https://github.com/GSIEnvironmental/mar_tool/blob/main/CHANGELOG.md"
homepage = "https://github.com/GSIEnvironmental/mar_tool"

[project.scripts]
mar_dss = "mar_dss.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120
# pfdf is copied from the USGS pfdf package, so leave it as is.
extend-exclude = ["src/mar_dss/pfdf"]

[tool.ruff.lint]
# Same rule set as our other apps.
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle[error]
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PLE", # pylint errors
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle[warning]
]
ignore = [
    # "E501",  # the formatter wraps code; long strings and comments are left as they are
    # "C408",  # dict(...) is idiomatic for Dash style= and props
    # "N802",  # names follow hydrogeology notation (K, Ss, Sy, Q)
    # "N803",  # names follow hydrogeology notation (K, Ss, Sy, Q)
    # "N806",  # names follow hydrogeology notation (K, Ss, Sy, Q)
    # "N812",  # names follow hydrogeology notation (K, Ss, Sy, Q)
    # # TODO: existing issues, ignored for now so pre-commit and CI pass. To fix
    # # one, delete its line, run `uv run --extra test ruff check .` and fix what it finds.
    # "F841",  # unused-variable (32)
    # "B905",  # zip-without-explicit-strict (17)
    # "F401",  # unused-import (17)
    # "SIM108",  # if-else-block-instead-of-if-exp (17)
    # "SIM210",  # if-expr-with-true-false (15)
    # "SIM105",  # suppressible-exception (7)
    # "B007",  # unused-loop-control-variable (6)
    # "SIM103",  # needless-bool (6)
    # "S110",  # try-except-pass (5)
    # "SIM102",  # collapsible-if (5)
    # "SIM118",  # in-dict-keys (5)
    # "B904",  # raise-without-from-inside-except (4)
    # "E722",  # bare-except (3)
    # "E741",  # ambiguous-variable-name (3)
    # "C416",  # unnecessary-comprehension (2)
    # "S104",  # hardcoded-bind-all-interfaces (2)
    # "SIM109",  # compare-with-tuple (2)
    # "F402",  # import-shadowed-by-loop-var (1)
    # "S112",  # try-except-continue (1)
    # "S324",  # hashlib-insecure-hash-function (1)
    # "S603",  # subprocess-without-shell-equals-true (1)
    # "SIM115",  # open-file-with-context-handler (1)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks

[tool.uv]
package = true

# Version bumps: `just bump-patch`, `just bump-minor` or `just bump-major`.
# Each one updates the version below and in [project], re-locks uv.lock,
# then commits and tags the result as v<version>. Pushing the tag to GitHub
# deploys to production (see .github/workflows/ci-cd.yaml).
[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version to {new_version}"
tag_message = "Version {new_version}"
pre_commit_hooks = [
    "uv lock",
    "git add uv.lock",
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# Turn the "Unreleased" section into a dated one for the new version.
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

______________________________________________________________________

## [{new_version}] - {now:%Y-%m-%d}"""
